name: Python package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ["3.7", "3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install "tox>=4,<5"
      - name: Run tests
        env:
          TARGET_PYTHON: ${{ matrix.python }}
        run: tox -e "py${TARGET_PYTHON/./}"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: coverage-py${{ matrix.python }}
          path: .tox/py*/tmp/htmlcov/
          if-no-files-found: error

  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install "tox>=4,<5"
      - run: tox -e lint,mypy
