[metadata]
name = pyramid_session_multi
version = attr: pyramid_session_multi.__VERSION__
description = Provides a framework for creating multiple ad hoc session binds in Pyramid.
long_description = file: README.md
long_description_content_type = text/markdown
classifiers =
    Intended Audience :: Developers
    Framework :: Pyramid
    Programming Language :: Python
    Programming Language :: Python :: 3
keywords = pyramid session web
author = Jonathan Vanasco
author_email = jvanasco@2xlp.com
url = https://github.com/jvanasco/pyramid_session_multi
license = MIT
license_files = LICENSE.txt

[options]
packages = find:
package_dir =
    = src
python_requires = >=3.7
zip_safe = False
install_requires =
    pyramid>=2
    # Pyramid 2.0 imports pkg_resources without declaring a setuptools cap.
    setuptools<82; python_version < "3.10"
    typing_extensions
    zope.interface

[options.packages.find]
where = src

[options.package_data]
pyramid_session_multi =
    py.typed
    debugtoolbar/panels/templates/*

[options.extras_require]
testing =
    pytest
    pyramid_debugtoolbar>=4.0

[tox:tox]
envlist = lint,mypy,py37,py38,py39,py310,py311,py312,py313,py314,py315

[testenv]
extras = testing
deps = coverage
commands =
    coverage run -m pytest {posargs}
    coverage html -d {envtmpdir}/htmlcov
setenv =
    COVERAGE_FILE = {envtmpdir}/.coverage

[testenv:lint]
skip_install = true
extras =
deps =
    black==26.10.1
    flake8==7.1.1
commands =
    black --check src tests examples
    flake8 src tests examples

[testenv:mypy]
deps = mypy
commands = mypy src

[coverage:run]
source = pyramid_session_multi
branch = true

[easy_install]
zip_ok = false

[flake8]
application_import_names = pyramid_session_multi
import_order_style = appnexus

#  E501 line too long (81 > 79 characters)
per-file-ignores:
    build/*: *
    examples/*: E501
    src/pyramid_session_multi/__init__.py: E501
    src/pyramid_session_multi/debugtoolbar/panels/session_multi.py: E501
    tests/*: E501


